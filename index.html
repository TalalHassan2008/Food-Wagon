<!DOCTYPE html>
<html lang="en">
<head>
    
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Wagon</title>
</head>
<body>
    <nav class="navbar">

        
        <div class="logo">
            <img src="./assests/Logo.png" alt="FoodWagon Logo">
        </div>


        <div class="delivery">
            <strong>Deliver to:</strong>
            <i class="fa-solid fa-location-dot"></i>
            <span>Current Location</span>
            <b>burns  road  foodstreet ,karachi</b>
        </div>


        <div class="nav-right">
            <span class="search">
                
<i class="fa-solid fa-magnifying-glass"></i>

                Search Food
            </span>
            <button class="login">                
<i class="fa-solid fa-user"></i>
Login
            </button>
        </div>

    </nav>

   
<!-- Hero Section -->
<section class="hero">

    <!-- Left Content -->
    <div class="hero-content">

        <h1>Are You Starving?</h1>

        <p>
            Within a few clicks, find meals that are accessible near you
        </p>

        <!-- Order Card -->
        <div class="order-box">

            <!-- Delivery and Pickup -->
            <div class="order-options">

                <button class="delivery-btn">
                    <i class="fa-solid fa-motorcycle"></i>
                    Delivery
                </button>

                <button class="pickup-btn">
                    <i class="fa-solid fa-suitcase"></i>
                    Pickup
                </button>

            </div>

            <!-- Address Input -->
            <div class="address-box">

                <i class="fa-solid fa-location-dot"></i>

                <input
                    type="text"
                    placeholder="Enter Your Address"
                >

                <button class="find-food-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Find Food
                </button>

            </div>

        </div>
    </div>

    <!-- Right Food Image -->
    <div class="hero-image">
        <img src="assests/img.png" alt="Delicious food">
    </div>

</section>

</body>
</html>
